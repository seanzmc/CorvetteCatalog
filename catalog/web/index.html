<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corvette catalog · Build review</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><p class="eyebrow">CORVETTE CATALOG</p><h1>Build review</h1><p>Choose your Corvette. Review every change before applying it.</p><small id="release"></small></header>
<main><section id="setup"><label>Model <select id="model"></select></label><label>Configuration <select id="configuration"></select></label><button id="start">Start build</button></section>
<p id="error" role="alert"></p><section id="build" hidden><div class="toolbar"><h2 id="total"></h2><button id="revert">Revert last change</button><button id="export">Export build</button></div><p id="requirements"></p><details><summary>Current build and equipment</summary><div id="recap"></div></details><label>Interior <select id="interior"></select></label><button id="chooseInterior">Review interior change</button><label>Find an option <input id="search" type="search" placeholder="RPO or name"></label><div id="options"></div></section></main>
<dialog id="warning" aria-labelledby="warningTitle"><h2 id="warningTitle">Review changes</h2><p>Your build remains unchanged until you confirm.</p><ul id="changes"></ul><div class="actions"><button id="cancel">Cancel</button><button id="confirm">Confirm these changes</button></div></dialog>
<footer>Local catalog review. Build exports are not dealer submissions. Visual artwork is not yet bound.</footer></body></html>
