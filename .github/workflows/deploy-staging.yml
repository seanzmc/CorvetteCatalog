name: Deploy staging

# Builds a release of the checked-in catalog and deploys it to Cloudflare
# staging (Worker + Container). Runs only when started by hand.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and
# STAGING_BUILD_TOKEN_KEY (32+ characters), optional STAGING_PASSWORD, and the
# repository variable STAGING_ORIGIN (e.g. https://corvette-catalog-staging.<you>.workers.dev).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build release and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check configuration
        env:
          KEY: ${{ secrets.STAGING_BUILD_TOKEN_KEY }}
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(secret:CLOUDFLARE_API_TOKEN)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(secret:CLOUDFLARE_ACCOUNT_ID)
          [ ${#KEY} -ge 32 ] || missing+=("secret:STAGING_BUILD_TOKEN_KEY (32+ characters)")
          [[ "$STAGING_ORIGIN" == https://* ]] || missing+=("variable:STAGING_ORIGIN (https://...)")
          if [ ${#missing[@]} -gt 0 ]; then printf 'Missing %s\n' "${missing[@]}"; exit 1; fi

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Build a verified release of the checked-in catalog
        run: |
          store=.local/staging/releases
          digest=$(python -m catalog.releases prepare .local/staging/draft.sqlite)
          # Freeze prints the six-model audit progress; its last line is the ID.
          frozen=$(python -m catalog.releases --store "$store" freeze .local/staging/draft.sqlite --expected-digest "$digest" | tee /dev/stderr | tail -n 1)
          release=$(python -m catalog.releases --store "$store" complete "$frozen" | tail -n 1)
          python -m catalog.releases --store "$store" verify "$release" > /dev/null
          python -m catalog.deploy package --store "$store" --release "$release" --output deploy/cloudflare/package
          echo "RELEASE=$release" >> "$GITHUB_ENV"
          echo "Release $release" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - run: npm ci
        working-directory: deploy/cloudflare

      - name: Deploy Worker and container
        working-directory: deploy/cloudflare
        run: npx wrangler deploy --var "CATALOG_ORIGIN:$STAGING_ORIGIN"

      - name: Set container secrets
        working-directory: deploy/cloudflare
        env:
          KEY: ${{ secrets.STAGING_BUILD_TOKEN_KEY }}
          PASSWORD: ${{ secrets.STAGING_PASSWORD }}
        run: |
          printf '%s' "$KEY" | npx wrangler secret put CATALOG_BUILD_TOKEN_KEY
          if [ -n "$PASSWORD" ]; then printf '%s' "$PASSWORD" | npx wrangler secret put STAGING_PASSWORD; fi

      - name: Check the deployed release answers
        env:
          PASSWORD: ${{ secrets.STAGING_PASSWORD }}
        run: |
          auth=()
          [ -z "$PASSWORD" ] || auth=(-u "staging:$PASSWORD")
          # A new container can take a few minutes to provision.
          for i in $(seq 1 30); do
            body=$(curl -fsS "${auth[@]}" "$STAGING_ORIGIN/healthz" 2>/dev/null) && echo "$body" | grep -q "$RELEASE" && { echo "$body"; exit 0; }
            sleep 20
          done
          echo "Staging did not report release $RELEASE"; exit 1
