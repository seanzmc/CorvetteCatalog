name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      six_model_audit:
        description: Also run the full six-model semantic audit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The raw manufacturer guide under sources/raw/ is Git-ignored by agreement.
  # Tests that read it report as skipped here and still run on the owner's Mac.
  CATALOG_RAW_SOURCES: absent
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - id: plan
        # See the planner for how every test file is assigned to one job.
        env:
          SPLIT: >-
            test_authoring_operations.py=4
            test_releases.py=4
          SEPARATE: >-
            test_authoring.py
            test_authoring_components.py
            test_authoring_relationships.py
            test_model_discovery.py
          REMAINING_JOBS: "3"
        run: python .github/scripts/plan_test_shards.py >> "$GITHUB_OUTPUT"

  unit:
    name: ${{ matrix.shard.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run ${{ matrix.shard.modules }}
        env:
          MODULES: ${{ matrix.shard.modules }}
          FILTERS: ${{ matrix.shard.filters }}
        run: |
          status=0
          selection=()
          for pattern in $FILTERS; do selection+=(-k "$pattern"); done
          for module in $MODULES; do
            echo "::group::$module"
            # Discover from the module's own directory so files in importable
            # subdirectories run too; the basename pattern selects exactly it.
            dir="tests/$(dirname "$module")"
            python -m unittest discover -s "$dir" -p "$(basename "$module")" "${selection[@]}" || status=1
            echo "::endgroup::"
          done
          exit $status

  cloudflare-config:
    name: Cloudflare staging config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - run: npm ci
        working-directory: deploy/cloudflare
      # Bundles the Worker and validates wrangler.jsonc. The container image is
      # built only by the Deploy staging workflow, so a placeholder stands in.
      - name: Bundle the Worker
        working-directory: deploy/cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          mkdir -p package && echo 'FROM scratch' > package/Dockerfile
          npx wrangler deploy --dry-run --containers-rollout=none --outdir "$RUNNER_TEMP/worker"

  six-model-audit:
    name: Six-model semantic audit
    if: github.event_name == 'workflow_dispatch' && inputs.six_model_audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m catalog.semantic_validation --output semantic-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-audit
          path: semantic-audit.json
          if-no-files-found: ignore
